[project]
name = "aura-core"
version = "0.1.0"
description = "Privacy-first, ambient AI desktop layer powered by Gemma 4"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "httpx",
    "structlog",
    "typer",
    "psutil",
    "chardet",
    "pyperclip",
    "mss",
    "Pillow",
    "sounddevice",
    "numpy",
    "faster-whisper",
    "kokoro-onnx",
    "silero-vad",
    "onnxruntime",
    "python-xlib; sys_platform == 'linux'",
    "dbus-python; sys_platform == 'linux'",
    "pyobjc; sys_platform == 'darwin'",
    "pywin32; sys_platform == 'win32'",
]

[project.scripts]
aura = "cli:app"

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aura"]